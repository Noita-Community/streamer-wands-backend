# pnpm settings for this project. It is a single package, not a workspace; this file is
# simply where pnpm reads project-level settings from.

# Before `pnpm run` or `pnpm exec`, pnpm checks node_modules against its record of the last
# install, and by default installs when they differ. Here that must never happen implicitly:
# installs are run deliberately, from the host, so links and permissions come out right.
# `error` makes pnpm stop and say so instead.
#
# That record includes the project's absolute path. If the project is used from somewhere that
# sees it at a different path than where `pnpm install` ran (a container with a different mount
# point, for example), the check always fails with "The workspace structure has changed since
# last install". The fix is to mount the project at the same path in both places.
verifyDepsBeforeRun: error
